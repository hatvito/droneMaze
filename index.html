<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無人機演算法迷宮教學平台 (Drone Maze Algorithm Lab)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-container">
    <!-- 側邊控制列 -->
    <aside id="sidebar">
      <div>
        <h1>🛸 無人機迷宮導航</h1>
        <p class="subtitle">演算法與運算思維實驗平台</p>
      </div>

      <!-- 控制面板 -->
      <div class="panel-section">
        <h3>1. 導航演算法選擇</h3>
        <div class="form-group">
          <label for="algoSelect">解題演算法 (Algorithm)</label>
          <select id="algoSelect">
            <option value="righthand">右手法則 (Wall Follower)</option>
            <option value="dfs">深度優先搜尋 (DFS)</option>
            <option value="bfs" selected>廣度優先搜尋 (BFS)</option>
            <option value="astar">A* 啟發式搜尋 (A-Star)</option>
          </select>
        </div>
      </div>

      <div class="panel-section">
        <h3>2. 迷宮關卡配置</h3>
        <div class="form-group">
          <label for="mazeTypeSelect">地形地圖</label>
          <select id="mazeTypeSelect">
            <option value="random">隨機 Prim 迷宮 (21x21)</option>
            <option value="simple">基礎教學 S 型迷宮 (9x9)</option>
            <option value="loops">多路徑環狀迷宮 (13x13)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="speedSlider">飛行模擬步頻速度</label>
          <input type="range" id="speedSlider" min="10" max="100" value="75">
        </div>
        <div class="button-group" style="margin-top: 12px;">
          <button id="btnRun">🚀 起飛執行</button>
          <button id="btnReset" class="secondary">🔄 重設位置</button>
        </div>
      </div>

      <!-- 統計數據 -->
      <div class="panel-section">
        <h3>3. 演算法效能評測</h3>
        <div class="stats-grid">
          <div class="stat-item">
            <div class="label">探索節點數</div>
            <div id="statVisited" class="value">0</div>
          </div>
          <div class="stat-item">
            <div class="label">最終路徑步數</div>
            <div id="statPathLen" class="value">0</div>
          </div>
          <div class="stat-item" style="grid-column: span 2;">
            <div class="label">演算法運算耗時</div>
            <div id="statTime" class="value">0 ms</div>
          </div>
        </div>
      </div>

      <!-- 說明與圖例 -->
      <div class="panel-section">
        <h3>圖例與狀態說明</h3>
        <div class="legend-grid">
          <div class="legend-item">
            <div class="color-dot" style="background: #38bdf8;"></div>
            <span>起點 S</span>
          </div>
          <div class="legend-item">
            <div class="color-dot" style="background: #ef4444;"></div>
            <span>終點 E</span>
          </div>
          <div class="legend-item">
            <div class="color-dot" style="background: rgba(56, 189, 248, 0.4);"></div>
            <span>探索節點 (Visited)</span>
          </div>
          <div class="legend-item">
            <div class="color-dot" style="background: rgba(34, 197, 94, 0.7);"></div>
            <span>脫逃路徑 (Path)</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- 主舞台視覺化畫布 -->
    <main id="main-area">
      <div id="status-banner">系統就緒，請選擇演算法後起飛</div>
      <div id="canvas-container">
        <canvas id="mazeCanvas"></canvas>
      </div>
    </main>
  </div>

  <!-- 模組化載入指令碼 -->
  <script src="js/maze.js"></script>
  <script src="js/drone.js"></script>
  <script src="js/algorithms.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
