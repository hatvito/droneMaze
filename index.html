<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無人機演算法迷宮教學平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: { dark: '#0b1120', card: '#151f32', border: '#2a3a54', accent: '#38bdf8' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-cyber-dark text-slate-100 min-h-screen font-sans grid-bg flex flex-col justify-between">

  <!-- 頂部導航 -->
  <header class="border-b border-cyber-border bg-cyber-dark/95 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-gradient-to-tr from-cyan-500 via-sky-600 to-indigo-600 rounded-xl shadow-lg shadow-cyan-500/20">
          <i data-lucide="book-open" class="w-6 h-6 text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-extrabold bg-gradient-to-r from-cyan-400 via-sky-300 to-emerald-400 bg-clip-text text-transparent">
            無人機演算法迷宮教學平台
          </h1>
          <p class="text-xs text-slate-400">運算思維 · 演算法走訪波形與路徑回溯視覺化</p>
        </div>
      </div>

      <!-- 跳轉至競賽頁面 -->
      <a href="competition.html" class="px-4 py-2 rounded-lg text-sm font-semibold bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white shadow-lg transition flex items-center gap-2">
        <i data-lucide="trophy" class="w-4 h-4"></i> 前往迷霧尋跡大賽 &rarr;
      </a>
    </div>
  </header>

  <!-- 主教學區塊 -->
  <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    <!-- 左側面板 -->
    <div class="lg:col-span-4 flex flex-col gap-4">
      <div class="bg-cyber-card border border-cyber-border rounded-xl p-5 shadow-xl flex flex-col gap-4">
        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
          <i data-lucide="sliders" class="w-4 h-4 text-cyber-accent"></i> 演算法與地圖設定
        </h3>
        
        <div class="flex flex-col gap-1.5">
          <label class="text-xs text-slate-400">選擇解題演算法</label>
          <select id="select-learn-algo" class="bg-slate-900 border border-cyber-border rounded-lg px-3 py-2 text-xs text-sky-400 font-mono">
            <option value="righthand">右手法則 (Wall Follower)</option>
            <option value="dfs">深度優先搜尋 (DFS 回溯)</option>
            <option value="bfs" selected>廣度優先搜尋 (BFS 最短路)</option>
            <option value="astar">A* 啟發式搜尋 (A-Star)</option>
          </select>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs text-slate-400">迷宮地圖規格</label>
          <select id="select-maze-type" class="bg-slate-900 border border-cyber-border rounded-lg px-3 py-2 text-xs text-slate-200">
            <option value="random">隨機 Prim 迷宮 (21x21)</option>
            <option value="simple">基礎教學 S 型迷宮 (9x9)</option>
          </select>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs text-slate-400">飛行步進頻率</label>
          <input type="range" id="learn-speed" min="10" max="100" value="75" class="accent-cyber-accent cursor-pointer">
        </div>

        <div class="grid grid-cols-2 gap-3 mt-2">
          <button id="btn-run-learn" class="py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 font-bold text-white rounded-lg text-xs flex items-center justify-center gap-1.5 shadow">
            <i data-lucide="play" class="w-4 h-4 fill-current"></i> 起飛執行
          </button>
          <button id="btn-reset-learn" class="py-2.5 bg-slate-800 hover:bg-slate-700 font-semibold text-slate-300 border border-slate-700 rounded-lg text-xs flex items-center justify-center gap-1.5">
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i> 重設迷宮
          </button>
        </div>
      </div>

      <!-- 統計面板 -->
      <div class="bg-cyber-card border border-cyber-border rounded-xl p-5 shadow-xl">
        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-1.5">
          <i data-lucide="activity" class="w-4 h-4 text-cyber-accent"></i> 演算法評測指標
        </h3>
        <div class="grid grid-cols-2 gap-3 text-center">
          <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-800">
            <div class="text-[10px] text-slate-400 uppercase">探索節點數 (Visited)</div>
            <div id="stat-visited" class="text-lg font-mono font-bold text-sky-400 mt-1">0</div>
          </div>
          <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-800">
            <div class="text-[10px] text-slate-400 uppercase">有效路徑步數 (Steps)</div>
            <div id="stat-path" class="text-lg font-mono font-bold text-emerald-400 mt-1">0</div>
          </div>
          <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-800 col-span-2">
            <div class="text-[10px] text-slate-400 uppercase">計算耗時 (Computation Time)</div>
            <div id="stat-time" class="text-lg font-mono font-bold text-amber-400 mt-1">0 ms</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右側畫布視窗 -->
    <div class="lg:col-span-8 bg-cyber-card border border-cyber-border rounded-xl p-5 flex flex-col items-center justify-center shadow-xl">
      <div class="mb-3 w-full flex justify-between items-center text-xs text-slate-400">
        <span>起點 (S): 藍色停機坪 · 終點 (E): 紅色目標點</span>
        <div class="flex items-center gap-3">
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-sky-500/40 inline-block"></span> 走訪節點</span>
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-emerald-500/70 inline-block"></span> 脫逃航線</span>
        </div>
      </div>
      <canvas id="mazeCanvas" class="rounded-lg border border-slate-800 bg-slate-950 shadow-inner"></canvas>
    </div>
  </main>

  <footer class="border-t border-cyber-border bg-cyber-dark/80 py-3 text-center text-xs text-slate-500">
    Drone Maze Algorithm Lab &copy; 2026 STEM Education Lab
  </footer>

  <script type="module" src="js/learn-app.js"></script>
</body>
</html>
