<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無人機迷宮演算法教學與競賽平台</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              dark: '#0b1120',
              card: '#151f32',
              border: '#2a3a54',
              accent: '#38bdf8',
              emerald: '#10b981',
              warning: '#f59e0b',
              danger: '#ef4444'
            }
          },
          fontFamily: {
            mono: ['Fira Code', 'JetBrains Mono', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- CodeMirror -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>

  <!-- Lucide & Confetti -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-cyber-dark text-slate-100 min-h-screen font-sans grid-bg flex flex-col justify-between overflow-x-hidden">

  <!-- HEADER -->
  <header class="border-b border-cyber-border bg-cyber-dark/95 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-gradient-to-tr from-cyan-500 via-sky-600 to-indigo-600 rounded-xl shadow-lg shadow-cyan-500/20">
          <i data-lucide="plane" class="w-6 h-6 text-white transform rotate-45"></i>
        </div>
        <div>
          <h1 class="text-xl font-extrabold bg-gradient-to-r from-cyan-400 via-sky-300 to-emerald-400 bg-clip-text text-transparent">
            無人機迷宮演算法教學與競賽平台
          </h1>
          <p class="text-xs text-slate-400">教學演示 · 演算法任務填空 · 戰爭迷霧同場競技</p>
        </div>
      </div>

      <!-- 核心三合一模式切換按鈕 -->
      <div class="flex items-center gap-2 bg-slate-900/90 p-1.5 rounded-lg border border-slate-800">
        <button id="tab-learn" class="px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 bg-cyber-accent/20 text-cyber-accent border border-cyber-accent/40 shadow">
          <i data-lucide="book-open" class="w-4 h-4"></i> 1. 演算法步進教學
        </button>
        <button id="tab-code" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 transition flex items-center gap-2 border border-transparent">
          <i data-lucide="code" class="w-4 h-4"></i> 2. 學生任務填空
        </button>
        <button id="tab-comp" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 transition flex items-center gap-2 border border-transparent">
          <i data-lucide="trophy" class="w-4 h-4"></i> 3. 迷霧大賽 (Benchmark)
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 py-4 w-full flex-grow flex flex-col gap-4">

    <!-- 模式 1: 原版核心演算法步進教學 -->
    <div id="panel-learn" class="grid grid-cols-1 lg:grid-cols-12 gap-4">
      <div class="lg:col-span-4 flex flex-col gap-4">
        <div class="bg-cyber-card border border-cyber-border rounded-xl p-4 shadow-xl flex flex-col gap-3">
          <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="sliders" class="w-4 h-4 text-cyber-accent"></i> 演算法與地圖設定
          </h3>
          <div class="flex flex-col gap-1">
            <label class="text-xs text-slate-400">解題演算法</label>
            <select id="select-learn-algo" class="bg-slate-900 border border-cyber-border rounded px-2.5 py-1.5 text-xs text-sky-400 font-mono">
              <option value="righthand">右手法則 (Wall Follower)</option>
              <option value="dfs">深度優先搜尋 (DFS 回溯)</option>
              <option value="bfs" selected>廣度優先搜尋 (BFS 最短路)</option>
              <option value="astar">A* 啟發式搜尋 (A-Star)</option>
            </select>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-xs text-slate-400">地圖關卡</label>
            <select id="select-maze-type" class="bg-slate-900 border border-cyber-border rounded px-2.5 py-1.5 text-xs text-slate-200">
              <option value="random">隨機 Prim 迷宮 (21x21)</option>
              <option value="simple">基礎教學 S 型迷宮 (9x9)</option>
            </select>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-xs text-slate-400">演示步頻速度</label>
            <input type="range" id="learn-speed" min="10" max="100" value="75" class="accent-cyber-accent cursor-pointer">
          </div>
          <div class="grid grid-cols-2 gap-2 mt-2">
            <button id="btn-run-learn" class="py-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 font-bold text-white rounded text-xs flex items-center justify-center gap-1">
              <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i> 執行演算法
            </button>
            <button id="btn-reset-learn" class="py-2 bg-slate-800 hover:bg-slate-700 font-semibold text-slate-300 border border-slate-700 rounded text-xs flex items-center justify-center gap-1">
              <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> 重設迷宮
            </button>
          </div>
        </div>

        <div class="bg-cyber-card border border-cyber-border rounded-xl p-4 shadow-xl">
          <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-1.5">
            <i data-lucide="bar-chart-2" class="w-4 h-4 text-cyber-accent"></i> 演算法走訪統計
          </h3>
          <div class="grid grid-cols-2 gap-2 text-center">
            <div class="bg-slate-900/80 p-2.5 rounded border border-slate-800">
              <div class="text-[10px] text-slate-400 uppercase">探索節點數</div>
              <div id="stat-visited" class="text-base font-mono font-bold text-sky-400 mt-1">0</div>
            </div>
            <div class="bg-slate-900/80 p-2.5 rounded border border-slate-800">
              <div class="text-[10px] text-slate-400 uppercase">最終路徑長度</div>
              <div id="stat-path" class="text-base font-mono font-bold text-emerald-400 mt-1">0</div>
            </div>
            <div class="bg-slate-900/80 p-2.5 rounded border border-slate-800 col-span-2">
              <div class="text-[10px] text-slate-400 uppercase">演算法運算耗時</div>
              <div id="stat-time" class="text-base font-mono font-bold text-amber-400 mt-1">0 ms</div>
            </div>
          </div>
        </div>
      </div>

      <div class="lg:col-span-8 bg-cyber-card border border-cyber-border rounded-xl p-4 flex flex-col items-center justify-center shadow-xl">
        <canvas id="mazeCanvas" class="rounded-lg border border-slate-800 bg-slate-950 shadow-inner"></canvas>
      </div>
    </div>

    <!-- 模式 2: 學生任務填空與腳本測試 -->
    <div id="panel-code" class="hidden grid-cols-1 lg:grid-cols-12 gap-4">
      <div class="lg:col-span-12 bg-cyber-card border border-cyber-border rounded-xl p-4 shadow-xl flex flex-col h-[600px]">
        <div class="flex items-center justify-between pb-3 border-b border-cyber-border">
          <div class="flex items-center gap-2">
            <i data-lucide="edit-3" class="w-4 h-4 text-emerald-400"></i>
            <h3 class="font-bold text-sm text-slate-200">學生任務填空編輯器</h3>
          </div>
          <div class="flex items-center gap-2 text-xs">
            <span class="text-slate-400">選擇任務範本:</span>
            <select id="select-code-template" class="bg-slate-900 border border-cyber-border rounded px-2 py-1 text-sky-400 font-mono">
              <option value="tremaux_todo" selected>★【學生任務填空】特雷莫演算法</option>
              <option value="tremaux">特雷莫演算法 (完整版)</option>
              <option value="incrementalDfs">增量 DFS 記憶探索</option>
              <option value="rightHand">沿牆搜尋法</option>
            </select>
            <button id="btn-run-code" class="px-4 py-1.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 text-white font-bold rounded flex items-center gap-1">
              <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i> 起飛驗證
            </button>
          </div>
        </div>
        <div class="flex-grow my-3 relative overflow-hidden rounded-lg border border-slate-800">
          <textarea id="code-editor"></textarea>
        </div>
      </div>
    </div>

    <!-- 模式 3: 迷霧尋跡大賽 (Benchmark) -->
    <div id="panel-comp" class="hidden flex-col gap-4">
      <div class="bg-cyber-card border border-cyber-border rounded-xl p-5 shadow-xl">
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-cyber-border">
          <div>
            <h2 class="text-lg font-bold text-cyan-400 flex items-center gap-2">
              <i data-lucide="trophy" class="w-5 h-5"></i> 迷霧尋跡大賽排行榜 (Benchmark)
            </h2>
            <p class="text-xs text-slate-400">在相同迷霧地圖下，評比「特雷莫」、「增量 DFS」、「沿牆法」與「學生自訂策略」的開圖率與步數。</p>
          </div>
          <button id="btn-run-benchmark" class="px-5 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 text-white font-bold rounded-lg flex items-center gap-2 text-sm shadow">
            <i data-lucide="play-circle" class="w-4 h-4"></i> 開始全能競賽評測
          </button>
        </div>

        <div class="overflow-x-auto rounded-lg border border-slate-800 bg-slate-950">
          <table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-900/90 text-xs uppercase text-slate-400 border-b border-slate-800 font-mono">
              <tr>
                <th class="p-3 text-center">名次</th>
                <th class="p-3">策略名稱</th>
                <th class="p-3 text-center">狀態</th>
                <th class="p-3 text-right">探索開圖率</th>
                <th class="p-3 text-right">移動步數</th>
                <th class="p-3 text-right">耗時</th>
                <th class="p-3 text-center">綜合評分</th>
              </tr>
            </thead>
            <tbody id="benchmark-body" class="divide-y divide-slate-800/60 font-mono">
              <tr>
                <td colspan="7" class="p-6 text-center text-slate-500">點擊上方按鈕啟動全能競賽評測</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <footer class="border-t border-cyber-border bg-cyber-dark/80 py-3 text-center text-xs text-slate-500">
    Drone Maze Integrated Lab &copy; 2026 STEM AI & Robotics Education Lab
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
